  return h ? `${h}:${pad(m)}:${pad(ss)}` : `${m}:${pad(ss)}`;
}
function humanSec(s) {
  s = Math.round(s || 0);
  if (s < 60) return s + ' giây';
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return m + ' phút' + (r ? ' ' + r + ' giây' : '');
  return Math.floor(m / 60) + ' giờ' + (m % 60 ? ' ' + (m % 60) + ' phút' : '');
}

}
const hueOf = id => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const colorFor = id => `hsl(${hueOf(id)} 50% 38%)`;
let toastT;
function toast(msg) {

}
function openModal(html, cls) { const b = $('#modalBody'); b.className = 'sheet' + (cls ? ' ' + cls : ''); $('#modal').classList.toggle('full', /\bprof\b/.test(cls || '')); b.innerHTML = html; b.scrollTop = 0; $('#modal').classList.remove('hidden'); icons(); }

$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/* ===== Trạng thái ===== */
const unsubs = []; let tickTimer = 0, restarting = false;
const listen = (path, cb, err) => { const f = onValue(ref(db, path), cb, err); unsubs.push(f); return f; };
let uid = null, user = null, flowers = {}, fertilizers = {}, photos = {}, rotation = null, chars = {};
let vipRot = null, vipRotReady = false, vipRotating = false;
let vipItems = {}, vipReady = false, vipLoaded = false, vipSub = 'avatar', accInv = 'avatar', accTab = 'photos', editDraft = null;
let offset = 0, curTab = 'garden', invSub = 'items', deliv = null, fert = null, shopSub = 'seeds';
const now = () => Date.now() + offset;
const fertList = () => Object.entries(fertilizers).map(([id, f]) => ({ id, ...f })).sort((a, b) => (a.price || 0) - (b.price || 0));
const flowerList = () => Object.entries(flowers).map(([id, f]) => ({ id, ...f })).sort((a, b) => (a.seedPrice || 0) - (b.seedPrice || 0));

/* Giao dịch an toàn trên nhánh users/<uid> */
async function mutate(fn, silent) {
  if (!uid) { if (guest) requireLogin(); return false; }
  let err = null;
  try {
    const res = await runTransaction(ref(db, 'users/' + uid), cur => {
      if (cur === null) return cur;
      err = null;
      const u = JSON.parse(JSON.stringify(cur));
      const r = fn(u);
      if (typeof r === 'string') { err = r; return; }
      return u;
    });
    if (err) { if (!silent) toast(err); return false; }
    return res.committed;
  } catch (e) { console.error(e); toast('Lỗi kết nối, hãy thử lại'); return false; }
}

/* ===== Đăng nhập / Đăng ký bằng E-mail (Firebase Authentication) ===== */
const AUTH_ERR = {
  'auth/invalid-email': 'E-mail không hợp lệ',
  'auth/invalid-credential': 'Sai e-mail hoặc mật khẩu',
  'auth/user-not-found': 'Sai e-mail hoặc mật khẩu',
  'auth/wrong-password': 'Sai e-mail hoặc mật khẩu',
  'auth/email-already-in-use': 'E-mail này đã được đăng ký',
  'auth/weak-password': 'Mật khẩu tối thiểu 6 ký tự',
  'auth/too-many-requests': 'Thử quá nhiều lần, hãy đợi một lát',
  'auth/network-request-failed': 'Lỗi mạng, hãy kiểm tra kết nối',
  'auth/operation-not-allowed': 'Chưa bật đăng nhập E-mail/Mật khẩu trong Firebase Console'
};
let mode = 'login', pendingName = null, guest = false, started = false;
const GUEST_OK = new Set(['gSub', 'closeModal', 'authOpen', 'tab', 'sub', 'shopSub', 'vipSub', 'accSub', 'gotoSeeds', 'gotoFerts']);
function requireLogin() { openAuth('login', 'Hãy đăng nhập để chơi và mua đồ.'); }
function openAuth(m, hint) {
  openModal(`<div class="am">
    <button class="am-x" type="button" data-act="closeModal" aria-label="Đóng">×</button>
    <h3>Nông Trại Hoa</h3>
    ${hint ? `<p class="am-hint">${esc(hint)}</p>` : ''}
    <div class="seg"><button id="aLogin" type="button">Đăng nhập</button><button id="aReg" type="button">Đăng ký</button></div>
    <form id="aForm" novalidate>
      <input id="aEmail" class="field" type="email" placeholder="E-mail" autocomplete="email" autocapitalize="none">
      <div id="aNameWrap" class="hidden"><input id="aName" class="field" placeholder="Tên hiển thị (không bắt buộc)" maxlength="20"></div>
      <input id="aPass" class="field" type="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" autocomplete="current-password">
      <div id="aErr" class="err"></div>
      <button id="aBtn" class="btn">Đăng nhập</button>
      <button id="aForgot" class="linkbtn" type="button">Quên mật khẩu?</button>
    </form>
  </div>`, 'am');
  $('#aLogin').onclick = () => setMode('login');
  $('#aReg').onclick = () => setMode('register');
  $('#aForm').addEventListener('submit', submitAuth);
  $('#aForgot').onclick = forgotPass;
  setMode(m === 'register' ? 'register' : 'login');
}
function setMode(m) {
  mode = m;
  $('#aLogin').classList.toggle('on', m === 'login');
  $('#aReg').classList.toggle('on', m === 'register');
  $('#aBtn').textContent = m === 'login' ? 'Đăng nhập' : 'Tạo tài khoản';
  $('#aNameWrap').classList.toggle('hidden', m !== 'register');
  $('#aForgot').classList.toggle('hidden', m !== 'login');
  $('#aPass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('#aErr').style.color = ''; $('#aErr').textContent = '';
}
function setBusy(b, label) {
  const btn = $('#aBtn'); if (!btn) return;
  btn.disabled = b;
  btn.innerHTML = b ? `<span class="spin"></span>${label}` : (mode === 'login' ? 'Đăng nhập' : 'Tạo tài khoản');
  ['#aEmail', '#aPass', '#aName', '#aLogin', '#aReg', '#aForgot'].forEach(q => { const el = $(q); if (el) el.disabled = b; });
}
function authFail(msg) {
  const er = $('#aErr'); if (er) { er.style.color = ''; er.textContent = msg; }
  const c = $('#modalBody'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
}
async function submitAuth(e) {
  e.preventDefault();
  const email = $('#aEmail').value.trim(), pass = $('#aPass').value;
  $('#aErr').style.color = ''; $('#aErr').textContent = '';
  if (!/^\S+@\S+\.\S+$/.test(email)) { authFail('E-mail không hợp lệ'); return; }
  if (pass.length < 6) { authFail('Mật khẩu tối thiểu 6 ký tự'); return; }
  setBusy(true, mode === 'register' ? 'Đang tạo tài khoản…' : 'Đang đăng nhập…');
  try {
    if (mode === 'register') {
      pendingName = $('#aName').value.trim().slice(0, 20) || null;
      try { if (pendingName) sessionStorage.setItem('nt_name', pendingName); } catch (e) { /* bỏ qua */ }
      await createUserWithEmailAndPassword(auth, email, pass);
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
    restartSession('Đang vào tài khoản…');   // thành công: loading lại toàn bộ rồi vào game
  } catch (x) {
    pendingName = null; try { sessionStorage.removeItem('nt_name'); } catch (e) { /* bỏ qua */ }
    setBusy(false); authFail(AUTH_ERR[x.code] || ('Lỗi: ' + x.message));
  }
}
async function forgotPass() {
  const email = $('#aEmail').value.trim(), er = $('#aErr');

/* ===== Khách hàng ===== */
/* Khách hàng: yêu cầu đa dạng, tối đa 3 loại, tổng dưới 10 món, hợp với khả năng người chơi */
const KIND_W = [30, 45, 25];            // % khách đòi 1, 2, 3 loại (tối đa 3)
const QTY_W = [38, 30, 18, 10, 4];      // % số lượng mỗi loại: 1..5
const MAX_ORDER_ITEMS = 9;              // tổng số món tối đa (dưới 10)
const CUSTOMER_WAIT_MIN = 10;           // khách chờ tối đa (phút)
/* 4 tính cách: w = tỉ lệ %, tip = khoảng tiền bo (xu), wait = số phút chịu chờ */
const MOODS = [
  { k: 'n', w: 45, tip: [3, 6],  wait: 10, label: 'Bình thường', icon: 'smile' },
  { k: 's', w: 20, tip: [1, 2],  wait: 10, label: 'Keo kiệt',    icon: 'meh' },
  { k: 'g', w: 20, tip: [7, 10], wait: 10, label: 'Hào phóng',   icon: 'laugh' },
  { k: 'a', w: 15, tip: [1, 3],  wait: 6,  label: 'Khó chịu',    icon: 'angry' }
];
const MOOD_BY = Object.fromEntries(MOODS.map(m => [m.k, m]));
/* ===== Nhân vật khách: dữ liệu lấy từ admin_data/customers ===== */
const HEX = /^#[0-9a-f]{6}$/i;
const inkOn = h => { const n = parseInt(h.slice(1), 16), l = 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255); return l > 160 ? '#1b2133' : '#fff'; };
/* Màu nhãn tính cách do admin chọn (ưu tiên dữ liệu nhân vật hiện tại, không có thì dùng bản chụp trong đơn khách) */
function moodStyle(c) {
  const ch = c.ch != null ? chars[c.ch] : null, col = ch ? ch.color : c.mc;
  return HEX.test(col || '') ? ` style="background:${col};color:${inkOn(col)}"` : '';
}
function charList() {
  const l = Object.entries(chars || {}).filter(([, c]) => c && c.name).map(([id, c]) => {
    const tone = MOOD_BY[c.tone] ? c.tone : 'n', m = MOOD_BY[tone];
    let lo = Number(c.tipMin), hi = Number(c.tipMax);
    if (!isFinite(lo)) lo = m.tip[0]; if (!isFinite(hi)) hi = m.tip[1];
    lo = Math.max(0, Math.round(lo)); hi = Math.max(lo, Math.round(hi));
    const wait = Math.min(180, Math.max(1, Number(c.wait) || m.wait));
    const weight = c.weight == null || c.weight === '' ? 10 : Math.max(0, Number(c.weight) || 0);
    return { id, name: String(c.name), emoji: c.emoji || '🙂', tone, label: c.label || m.label, color: HEX.test(c.color || '') ? c.color : '', tipMin: lo, tipMax: hi, wait, weight };
  });
  return l;
}
function pickChar(list) {
  const sum = list.reduce((a, c) => a + c.weight, 0);
  if (!(sum > 0)) return list[rand(0, list.length - 1)];
  let r = Math.random() * sum;
  for (const c of list) { if ((r -= c.weight) < 0) return c; }
  return list[list.length - 1];
}
/* Hiển thị khách: ưu tiên dữ liệu nhân vật hiện tại (đổi ảnh ở admin là cập nhật ngay), thiếu thì dùng bản chụp lưu trong đơn khách */
function custLook(c, i) {
  const ch = c.ch != null ? chars[c.ch] : null;
  const name = String((ch && ch.name) || c.cn || 'Khách');
  const emoji = (ch && ch.emoji) || c.ce || '🙂';
  const url = ch && /^https?:\/\//i.test(ch.url || '') ? ch.url : '';
  const html = url ? `<img class="cimg" src="${esc(url)}" alt="${esc(name)}" draggable="false">` : esc(emoji);
  return { name, html };
}
function weighted(w) {
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < w.length; i++) if ((r -= w[i]) < 0) return i + 1;
  return w.length;
}
/* Khách đòi KHÓ: ưu tiên loại hoa người chơi đang thiếu / không có trong kho (kho có nhiều thì gần như không bao giờ bị hỏi).
   Chỉ đòi thứ làm được kịp giờ: hoa phải chín trong ~85% thời gian chờ, đủ ô đất để trồng, đủ xu để mua hạt.
   Người chơi giàu hoặc nhiều ô đất sẽ gặp đơn nhiều loại, số lượng lớn hơn và thưởng cao hơn. */
function genCustomer(u, used, ctx) {
  const fl = flowerList(), money = u.money || 0, plots = u.plotCount || FREE_PLOTS;
  const cl = charList(), freeC = cl.filter(x => !used.has(x.id)), chr = pickChar(freeC.length ? freeC : cl);
  const mood = { k: chr.tone, label: chr.label, tip: [chr.tipMin, chr.tipMax], wait: chr.wait };
  const waitMs = mood.wait * 60000, stock = u.flowers || {}, seeds = u.seeds || {};
  const gms = f => (Number(f.growSeconds) || 60) * 1000, sp = f => Math.max(1, Number(f.seedPrice) || 1);
  const cyc = f => Math.floor(waitMs * 0.85 / gms(f));                 // số lứa trồng kịp trong thời gian khách chờ
  const feas = fl.filter(f => cyc(f) >= 1);
  const pool = feas.length ? feas : fl.slice().sort((a, b) => gms(a) - gms(b)).slice(0, 1);
  const wealth = money >= 20000 ? 2 : money >= 3000 ? 1 : 0, skill = plots >= 7 ? 2 : plots >= 4 ? 1 : 0;
  const kinds = Math.min(3, weighted(KIND_W) + (wealth ? 1 : 0));
  // ngân sách ô đất và xu còn lại sau khi trừ phần các khách khác đang đòi
  let slots = plots, cash = money * 0.6;
  Object.entries(ctx.dem).forEach(([id, d]) => {
    const f = flowers[id]; if (!f) return;
    const ex = Math.max(0, d - (stock[id] || 0)); if (!ex) return;
    slots -= Math.ceil(ex / Math.max(1, cyc(f))); cash -= Math.max(0, ex - (seeds[id] || 0)) * sp(f);
  });
  const stLeft = f => Math.max(0, (stock[f.id] || 0) - (ctx.dem[f.id] || 0));
  const extraMax = f => Math.max(0, Math.min(Math.max(0, slots) * Math.max(1, cyc(f)), (seeds[f.id] || 0) + Math.floor(Math.max(0, cash) / sp(f))));
  const needs = {}; let hardUnits = 0;
  for (let k = 0; k < kinds; k++) {
    const cand = pool.filter(f => !needs[f.id]).map(f => {
      const ex = extraMax(f), sl = stLeft(f), maxQ = sl + ex;
      return { f, ex, sl, maxQ, w: maxQ > 0 ? Math.pow(1 / (1 + sl), 1.5) * (ex > 0 ? 1 : 0.15) / (1 + (ctx.cnt[f.id] || 0)) : 0 };
    }).filter(c => c.w > 0);
    const sum = cand.reduce((x, c) => x + c.w, 0); if (!sum) break;
    let t = Math.random() * sum, pick = cand[cand.length - 1];
    for (const c of cand) { if ((t -= c.w) < 0) { pick = c; break; } }
    const cap = Math.min(pick.maxQ, 5 + (wealth ? 1 : 0) + (skill ? 1 : 0));
    let q = Math.min(cap, weighted(QTY_W) + (wealth ? 1 : 0));
    if (pick.ex > 0 && q <= pick.sl && pick.sl < MAX_ORDER_ITEMS) q = Math.min(cap, pick.sl + 1 + rand(0, 1));   // đòi nhiều hơn số đang có
    q = Math.max(1, q);
    const ex = Math.max(0, q - pick.sl);
    if (ex > 0) { slots -= Math.ceil(ex / Math.max(1, cyc(pick.f))); cash -= Math.max(0, ex - (seeds[pick.f.id] || 0)) * sp(pick.f); hardUnits += ex; }
    needs[pick.f.id] = q;
  }
  if (!Object.keys(needs).length) {   // quá nghèo/hết ô: hỏi 1 bông loại rẻ nhất (ưu tiên loại có trong kho)
    const f = pool.slice().sort((a, b) => ((stock[b.id] || 0) > 0) - ((stock[a.id] || 0) > 0) || sp(a) - sp(b))[0]; if (f) needs[f.id] = 1;
  }
  let total = Object.values(needs).reduce((a, b) => a + b, 0);
  while (total > MAX_ORDER_ITEMS) {
    const big = Object.keys(needs).sort((a, b) => needs[b] - needs[a])[0];
    if (needs[big] <= 1) break;
    needs[big]--; total--; hardUnits = Math.min(hardUnits, total);
  }
  let base = 0;
  Object.entries(needs).forEach(([id, q]) => {
    base += (Number(flowers[id].sellPrice) || 1) * q;
    ctx.cnt[id] = (ctx.cnt[id] || 0) + 1; ctx.dem[id] = (ctx.dem[id] || 0) + q;
  });
  const hard = hardUnits > 0;
  if (hard) base = Math.round(base * (1 + 0.35 * Math.min(1, hardUnits / Math.max(1, total))));   // phải trồng thêm: thưởng cao hơn
  const tip = rand(mood.tip[0], mood.tip[1]);
  used.add(chr.id);
  return { needs, base, reward: base + tip, tip, ch: chr.id, cn: chr.name, ce: chr.emoji, m: mood.k, ml: mood.label, ...(chr.color ? { mc: chr.color } : {}), hard: hard ? 1 : 0, expiresAt: now() + mood.wait * 60000 };
}
let spawning = false;
async function spawnCustomers() {
  if (guest || spawning || !flowerList().length || !charList().length) return;
  spawning = true;
  try {
    await mutate(u => {
      const t = now(); u.customers = u.customers || {}; let ch = false;
      const act = Object.values(u.customers).filter(c => c && c.needs);
      const used = new Set(act.filter(c => c.ch != null).map(c => c.ch));
      const cnt = {}, dem = {};
      act.forEach(c => Object.entries(c.needs).forEach(([id, q]) => { cnt[id] = (cnt[id] || 0) + 1; dem[id] = (dem[id] || 0) + q; }));
      for (let i = 0; i < CUSTOMER_SLOTS; i++) {
        const c = u.customers['c' + i];
        if (c && c.needs) {
          if (!c.expiresAt) { c.expiresAt = t + CUSTOMER_WAIT_MIN * 60000; ch = true; }          // khách cũ chưa có hạn
          else if (c.expiresAt <= t) { u.customers['c' + i] = { readyAt: t + rand(COOLDOWN_MIN, COOLDOWN_MAX) * 1000 }; ch = true; } // chờ quá lâu: bỏ đi
          continue;
        }
        if (!c || !(c.readyAt > t)) { u.customers['c' + i] = genCustomer(u, used, { cnt, dem }); ch = true; }
      }
      if (!ch) return 'noop';
    }, true);
  } finally { spawning = false; }
}

const VIP_SELL_RATE = 0.1; // bán lại vật phẩm trang trí nhận 10% giá mua (đổi tại đây)
const VIP_SIZE = { avatar: 10, cover: 10, car: 10, phone: 10 }, VIP_ROTATE_MS = 4 * 3600 * 1000;

/* Lần đầu mở tab VIP: tải dữ liệu + xoay hàng + tải sẵn toàn bộ ảnh rồi mới hiển thị, để không bị giật */
async function vipBootRun() {
  if (vipBoot.running || vipBoot.done) return; vipBoot.running = true;
  try {
    vipBootSet(8, 'Đang kết nối cửa hàng…'); ensureVip();

    vipBootSet(32, 'Đang chuẩn bị hàng mới…'); t0 = Date.now();
    while (!guest && vipReady && !vipRotOk(vipRot, now()) && Date.now() - t0 < 8000) { ensureVipRotation(); await sleep(120); }
    const urls = [...new Set(Object.keys(VIP_SIZE).flatMap(c => vipIdsOf(vipRot, c).map(id => safeUrl(vipItems[id].url))).filter(Boolean))];
    if (urls.length) {
      let n = 0; vipBootSet(38, `Đang tải hình ảnh (0/${urls.length})…`);
      await Promise.race([
        Promise.all(urls.map(u => new Promise(res => {
          const im = new Image();
          im.onload = im.onerror = () => { n++; vipBootSet(38 + 60 * n / urls.length, `Đang tải hình ảnh (${n}/${urls.length})…`); res(); };
          im.src = u;
        }))),
        sleep(12000)
      ]);
    }
    vipBootSet(100, 'Sẵn sàng!'); await sleep(250);
  } finally { vipBoot.done = true; vipBoot.running = false; if (curTab === 'vip') renderVipShop(); }
}
const vipIdsOf = (r, c) => ((r && r.ids && r.ids[c]) || []).filter(id => vipItems[id] && vipItems[id].cat === c).slice(0, 10);
function vipRotOk(r, t) {
  if (!r || !r.at || t - r.at >= VIP_ROTATE_MS) return false;
  for (const c in VIP_SIZE) if (vipIdsOf(r, c).length < Math.min(VIP_SIZE[c], vipList(c).length)) return false;
  return true;
}
async function ensureVipRotation() {
  if (guest || vipRotating || !vipReady || !vipRotReady || vipRotOk(vipRot, now())) return;
  vipRotating = true;
  try {
    await runTransaction(ref(db, 'shop/vipRotation'), cur => {
      if (vipRotOk(cur, now())) return cur; // thiết bị khác đã xoay rồi
      const ids = {};
      for (const c in VIP_SIZE) ids[c] = shuffle(vipList(c).map(x => x.id)).slice(0, VIP_SIZE[c]);
      return { ids, at: now() };
    });
  } catch (e) { console.error(e); }
  finally { vipRotating = false; }
}
const VIP_TABS = [...Object.entries(VIP_CATS), ['photo', { name: 'Ảnh', icon: 'image' }]];
const vipList = cat => Object.entries(vipItems).filter(([, v]) => v && v.cat === cat && safeUrl(v.url)).map(([id, v]) => ({ id, ...v })).sort((a, b) => (a.price || 0) - (b.price || 0));
const vipThumb = (cat, url, extra = '') => `<div class="vthumb v-${cat} ${extra}"><img src="${esc(safeUrl(url))}" alt="" loading="lazy" decoding="async"></div>`;
const vipTabs = (cur, act) => `<div class="inv-tabs">` + Object.entries(VIP_CATS).map(([k, c]) => `<button class="${cur === k ? 'on' : ''}" data-act="${act}" data-s="${k}" style="padding:6px 2px;font-size:12px;flex-direction:column;gap:2px">${ico(c.icon)}${c.name}</button>`).join('') + `</div>`;

function renderVipShop() {

const ROUTES = { vuon: 'garden', 'hat-giong': 'seeds', kho: 'inv', shop: 'vip', 'tai-khoan': 'account', 'ngan-hang': 'bank', 'nhiem-vu': 'quest', 'xep-hang': 'lb', 'ban-be': 'friends' };
const PATH_OF = Object.fromEntries(Object.entries(ROUTES).map(([p, t]) => [t, p]));
const HASHMODE = location.protocol === 'file:' || /\.html?$/i.test(location.pathname); // mở file trực tiếp → dùng #/shop
function routeFromUrl() {
  const p = (HASHMODE ? location.hash.replace(/^#\/?/, '') : location.pathname).replace(/^\/|\/$/g, '');
  if (p === 'anh') { vipSub = 'photo'; return 'vip'; }
  return ROUTES[p] || 'garden';
}
function pushRoute(t, replace) {
  const url = HASHMODE ? '#/' + PATH_OF[t] : '/' + PATH_OF[t];
  if ((HASHMODE ? location.hash : location.pathname) === (HASHMODE ? url : url)) return;
  try { history[replace ? 'replaceState' : 'pushState'](null, '', url); } catch (e) { /* bỏ qua */ }
}
window.addEventListener('popstate', () => { if (user) switchTab(routeFromUrl(), true); });

/* Ảnh bí ẩn: chỉ vẽ bản 24px lên canvas (link ảnh gốc không nằm trong DOM) nên gỡ CSS làm mờ cũng không lộ ảnh */
const blurCache = new Map();
function paintBlur(root) {
  (root || document).querySelectorAll('canvas[data-bid]').forEach(cv => {
    const id = cv.dataset.bid; cv.removeAttribute('data-bid');
    const p = photos[id]; if (!p || !safeUrl(p.url)) return;
    const key = id + '|' + p.url, put = t => { cv.width = cv.height = 24; cv.getContext('2d').drawImage(t, 0, 0); };
    if (blurCache.has(key)) { put(blurCache.get(key)); return; }
    const im = new Image(); im.decoding = 'async';
    im.onload = () => {
      const t = document.createElement('canvas'); t.width = t.height = 24;
      const w = im.naturalWidth, h = im.naturalHeight, k = Math.min(w, h) || 1;
      t.getContext('2d').drawImage(im, (w - k) / 2, (h - k) / 2, k, k, 0, 0, 24, 24);
      blurCache.set(key, t); put(t); im.onload = null; im.removeAttribute('src');
    };
    im.src = p.url;
  });
}

/* ===== Vòng lặp mỗi giây ===== */
let sig = '';
function gardenSig(t) {
  let s = ''; const pd = user.plotData || {}, cs = user.customers || {};
  for (let i = 0; i < MAX_PLOTS; i++) { const p = pd['p' + i]; s += p ? (!p.readyAt ? 'W' : t >= p.readyAt ? 'R' : 'G') : '-'; }
  for (let i = 0; i < CUSTOMER_SLOTS; i++) {
    const c = cs['c' + i];
    s += (!c || (!c.needs && !(c.readyAt > t))) ? 'N' : (c.needs ? ((!c.expiresAt || c.expiresAt <= t) ? 'X' : 'C') : 'W');
  }
  return s;
}
function updateTimers(t) {
  document.querySelectorAll('.timer[data-until]').forEach(el => { el.textContent = fmtClock(Number(el.dataset.until) - t); });
  document.querySelectorAll('.sprout[data-until]').forEach(el => {
    const a = Number(el.dataset.from), b = Number(el.dataset.until), g = sproutAt((t - a) / (b - a));
    if (el.textContent !== g) el.textContent = g;
  });
  document.querySelectorAll('.bar b[data-until]').forEach(el => {
    const a = Number(el.dataset.from), b = Number(el.dataset.until);
    el.style.width = Math.min(100, Math.max(0, (t - a) / (b - a) * 100)) + '%';
  });
}
function tick() {
  if (!user) return;
  const t = now();
  updateTimers(t);
  const s = gardenSig(t);
  if (s !== sig) { sig = s; if (curTab === 'garden') renderGarden(); }
  if (/[NX]/.test(s.slice(MAX_PLOTS))) spawnCustomers();
  ensureRotation();
  if (curTab === 'vip') ensureVipRotation();
  checkLoan();
  if (!guest) for (const g of lowGear(user)) { const k = g.id + ':' + curDur(g.v); if (!warnedGear.has(k)) { warnedGear.add(k); toast(`⚠️ ${g.v.name || 'Vật phẩm'} sắp hỏng, chỉ còn ${curDur(g.v)} độ bền. Hãy sửa chữa!`); if (curTab === 'garden') renderGarden(); break; } }
  if (curTab === 'quest' && questDay !== dayKey(t)) renderQuest();
  publishScore(); publishProfile();
  if (curTab === 'lb') ensureLbFresh();
}

/* ===== Xoay vòng cửa hàng ảnh (lưu tại shop/rotation) ===== */
let rotating = false;
async function ensureRotation() {
  const list = Object.keys(photos);
  if (guest || rotating || !list.length) return;
  const t = now(), want = Math.min(SHOP_SIZE, list.length);
  const valid = ((rotation && rotation.ids) || []).filter(id => photos[id]);
  if (rotation && rotation.at && t - rotation.at < ROTATE_MS && valid.length >= want) return;
  rotating = true;
  try {
    await runTransaction(ref(db, 'shop/rotation'), cur => {
      const tt = now();
      const ok = cur && cur.at && tt - cur.at < ROTATE_MS && (cur.ids || []).filter(id => photos[id]).length >= want;
      if (ok) return cur; // thiết bị khác đã xoay rồi
      return { ids: shuffle(list).slice(0, SHOP_SIZE), at: tt };
    });
  } catch (e) { console.error(e); }
  finally { rotating = false; }
}

/* ===== Ngân hàng: vay xu, lãi cố định, tịch thu tài sản khi quá hạn ===== */
const LOAN_MAX = 10000, LOAN_MIN = 1000, LOAN_RATE = 0.2, LOAN_MAX_DAYS = 10, SEIZE_RATE = 0.5, DAY_MS = 86400000;
const KIND = { photo: { n: 'Ảnh', i: 'image' }, deco: { n: 'Trang trí', i: 'crown' }, seed: { n: 'Hạt giống', i: 'sprout' }, fert: { n: 'Phân bón', i: 'sparkles' } };
const loanOwed = l => l ? Math.max(0, (Number(l.total) || 0) - (Number(l.paid) || 0)) : 0;
let bankForm = { amount: 5000, days: 7 }, noticeSeen = 0, loanBusy = false;
const bankClamp = () => Math.min(LOAN_MAX, Math.max(0, Math.floor(Number(bankForm.amount) || 0)));
const bankTotal = a => Math.ceil(a * (1 + LOAN_RATE));
/* Tài sản ngân hàng có thể tịch thu, định giá = SEIZE_RATE × giá mua */
function seizeCandidates(u) {
  const c = [], v = x => Math.floor((Number(x) || 0) * SEIZE_RATE);
  Object.entries(u.photos || {}).forEach(([id, p]) => { if (p && v(p.price) > 0) c.push({ k: 'photo', id, n: 'Ảnh #' + shortId(id), u: v(p.price), q: 1, url: safeUrl(p.url) }); });
  Object.entries(u.vip || {}).forEach(([id, p]) => { if (p && v(p.price) > 0) c.push({ k: 'deco', id, n: p.name || 'Vật phẩm trang trí', u: v(p.price), q: 1, url: safeUrl(p.url) }); });
  Object.entries(u.seeds || {}).forEach(([id, q]) => { const f = flowers[id]; if (f && q > 0 && v(f.seedPrice) > 0) c.push({ k: 'seed', id, n: 'Hạt ' + f.name, u: v(f.seedPrice), q, url: '' }); });
  Object.entries(u.fertilizers || {}).forEach(([id, q]) => { const f = fertilizers[id]; if (f && q > 0 && v(f.price) > 0) c.push({ k: 'fert', id, n: f.name, u: v(f.price), q, url: '' }); });

/* Quá hạn: trừ xu trong ví trước, thiếu thì tịch thu tài sản (ít dư nhất), dư thì hoàn xu, hết tài sản thì xóa nợ còn lại */
function applySeize(u, t) {
  const l = u.loan; if (!l || loanOwed(l) <= 0 || t < l.dueAt) return false;
  const owed = loanOwed(l); let need = owed;
  const note = { at: t, owed, money: 0, items: [], surplus: 0, forgiven: 0 };
  note.money = Math.min(u.money || 0, need); u.money = (u.money || 0) - note.money; need -= note.money;
  const cs = seizeCandidates(u);
  while (need > 0) {
    const live = cs.filter(c => c.q > 0); if (!live.length) break;
    const fit = live.filter(c => c.u >= need).sort((a, b) => a.u - b.u)[0];
    const c = fit || live.sort((a, b) => b.u - a.u)[0];
    const q = fit ? 1 : Math.min(c.q, Math.max(1, Math.floor(need / c.u)));
    c.q -= q; need -= q * c.u;
    const e = note.items.find(x => x.k === c.k && x.id === c.id);
    if (e) e.q += q; else note.items.push({ k: c.k, id: c.id, n: c.n, q, u: c.u, url: c.url });
    if (c.k === 'photo') delete u.photos[c.id];
    else if (c.k === 'deco') { delete u.vip[c.id]; if (u.avatar === c.id) delete u.avatar; if (u.cover === c.id) delete u.cover; if (u.equip) for (const k of Object.keys(u.equip)) if (u.equip[k] === c.id) delete u.equip[k]; }
    else { const o = c.k === 'seed' ? u.seeds : u.fertilizers; o[c.id] -= q; if (o[c.id] <= 0) delete o[c.id]; }
  }
  if (need < 0) { note.surplus = -need; u.money += note.surplus; } else note.forgiven = need;

}

async function ensureProfile(u) {
  const r = ref(db, 'users/' + u.uid);
  const snap = await get(r);
  if (!snap.exists()) {
    let saved = null; try { saved = sessionStorage.getItem('nt_name'); } catch (e) { /* bỏ qua */ }
    const nm = pendingName || saved || (u.email || 'player').split('@')[0].slice(0, 20);
    await set(r, { username: nm, email: u.email || '', money: START_MONEY, plotCount: FREE_PLOTS, createdAt: serverTimestamp() });
  }
  pendingName = null; try { sessionStorage.removeItem('nt_name'); } catch (e) { /* bỏ qua */ }
}

  }

  boot.show('Đang xác thực tài khoản…', 10);
  try {
    boot.set(14, 'Đang tải hồ sơ người chơi…');
    await ensureProfile(u);
    boot.set(24, 'Đang tải dữ liệu nông trại…');
    await startSession(u.uid);
    await boot.done(); initNotices();
  } catch (x) {
    boot.hide();
    toast('Lỗi tải dữ liệu: ' + x.message);
  }
});

const NTF_HIDE_KEY = 'nt_ntf_hide';          // localStorage: { [id]: 'YYYY-MM-DD' }
const ntfShownThisLoad = new Set();            // không bật lại trong cùng 1 lần tải trang
const ntfDay = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function ntfHideMap() { try { return JSON.parse(localStorage.getItem(NTF_HIDE_KEY) || '{}') || {}; } catch (e) { return {}; } }
function ntfHideToday(id) {
  try {
    const m = ntfHideMap(), today = ntfDay();
    Object.keys(m).forEach(k => { if (m[k] !== today) delete m[k]; });   // dọn mục cũ
    m[id] = today; localStorage.setItem(NTF_HIDE_KEY, JSON.stringify(m));
  } catch (e) { /* bỏ qua */ }
}
const ntfHiddenToday = id => ntfHideMap()[id] === ntfDay();

async function initNotices() {
  try {
    const t = now(), list = [];
    const snap = await get(ref(db, 'admin_data/notifications'));
    const all = snap.val() || {};
    Object.entries(all).forEach(([id, n]) => {
      if (!n || n.scope !== 'all' || n.active === false) return;
      if (!(Number(n.expiresAt) > t)) return;                       // hết hạn
      if (ntfHiddenToday(id) || ntfShownThisLoad.has(id)) return;
      list.push({ id, n, priv: false });
    });
    if (uid && !guest) {                                              // thư riêng gửi cho người chơi
      try {
        const s2 = await get(ref(db, 'users/' + uid + '/inbox'));
        Object.entries(s2.val() || {}).forEach(([id, n]) => {
          if (!n || ntfShownThisLoad.has(id)) return;
          if (!(Number(n.expiresAt) > t)) { remove(ref(db, 'users/' + uid + '/inbox/' + id)).catch(() => {}); return; }
          list.push({ id, n, priv: true });
        });
      } catch (e) { /* chưa có quyền đọc inbox thì bỏ qua */ }
    }
    list.sort((a, b) => (b.n.createdAt || 0) - (a.n.createdAt || 0));
    if (list.length) { await sleep(400); ntfShow(list, 0); }
  } catch (e) { console.warn('Thông báo:', e); }
}
function ntfShow(list, i) {
  document.getElementById('ntfOverlay')?.remove();
  if (i >= list.length) return;
  const { id, n, priv } = list[i];
  ntfShownThisLoad.add(id);
  const ov = document.createElement('div');
  ov.id = 'ntfOverlay'; ov.className = 'overlay';
  const img = safeUrl(n.imageUrl);
  ov.innerHTML = `<div class="sheet ntf" role="dialog" aria-modal="true">
    ${priv ? '<span class="ntf-tag">✉️ Thư dành riêng cho bạn</span>' : ''}
    <h3>${esc(n.title || 'Thông báo')}</h3>
    ${img ? `<img class="ntf-img" src="${esc(img)}" alt="" onerror="this.remove()">` : ''}
    <div class="ntf-txt">${esc(n.content || '').replace(/\n/g, '<br>')}</div>
    <div class="ntf-row">
      ${priv ? '' : '<button type="button" class="btn ghost" data-ntf="hide">Không hiện lại hôm nay</button>'}
      <button type="button" class="btn" data-ntf="ok">${priv ? 'Đã đọc' : 'Đóng'}</button>
    </div>
    ${list.length > 1 ? `<div class="ntf-cnt">${i + 1} / ${list.length}</div>` : ''}
  </div>`;
  const next = () => { ov.remove(); ntfShow(list, i + 1); };
  ov.addEventListener('click', e => {
    const b = e.target.closest('[data-ntf]');
    if (!b && e.target !== ov) return;
    if (b && b.dataset.ntf === 'hide') ntfHideToday(id);
    if (priv) remove(ref(db, 'users/' + uid + '/inbox/' + id)).catch(() => {});   // thư riêng: đọc xong thì xóa
    next();
  });
  document.body.appendChild(ov);
}

icons();
</script>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Đang kết nối máy chủ</title>
<style>
:root{--danger:#ff9a94;--gold:#ffc83d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;background:#0a1038}

/* ===== Cùng cấu trúc và kích thước với màn tải của game, để Trái Đất nằm đúng một vị trí ===== */
.boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;justify-content:safe center;gap:18px;padding:20px;overflow:auto;
  background:radial-gradient(120% 90% at 50% 20%,#16246b 0%,#0a1038 55%,#050819 100%)}
.boot .earth{display:flex;flex-direction:column;align-items:center}
.earth-loader{--watercolor:#3344c1;--landcolor:#7cc133;width:7.5em;height:7.5em;font-size:16px;background-color:var(--watercolor);position:relative;overflow:hidden;border-radius:50%;box-shadow:inset 0 .5em rgba(255,255,255,.25),inset 0 -.5em rgba(0,0,0,.25);border:solid .15em #fff;animation:startround 1s;animation-iteration-count:1}
.earth-loader svg:nth-child(1){position:absolute;bottom:-2em;width:7em;height:auto;animation:round1 5s infinite linear .75s}
.earth-loader svg:nth-child(2){position:absolute;top:-3em;width:7em;height:auto;animation:round1 5s infinite linear}
.earth-loader svg:nth-child(3){position:absolute;top:-2.5em;width:7em;height:auto;animation:round2 5s infinite linear}
.earth-loader svg:nth-child(4){position:absolute;bottom:-2.2em;width:7em;height:auto;animation:round2 5s infinite linear .75s}
@keyframes startround{0%{filter:brightness(500%);box-shadow:none}75%{filter:brightness(500%);box-shadow:none}100%{filter:brightness(100%);box-shadow:inset 0 .5em rgba(255,255,255,.25),inset 0 -.5em rgba(0,0,0,.25)}}
@keyframes round1{0%{left:-2em;opacity:1;transform:skewX(0) rotate(0)}30%{left:-6em;opacity:1;transform:skewX(-25deg) rotate(25deg)}31%{left:-6em;opacity:0;transform:skewX(-25deg) rotate(25deg)}35%{left:7em;opacity:0;transform:skewX(25deg) rotate(-25deg)}45%{left:7em;opacity:1;transform:skewX(25deg) rotate(-25deg)}100%{left:-2em;opacity:1;transform:skewX(0) rotate(0)}}
@keyframes round2{0%{left:5em;opacity:1;transform:skewX(0) rotate(0)}75%{left:-7em;opacity:1;transform:skewX(-25deg) rotate(25deg)}76%{left:-7em;opacity:0;transform:skewX(-25deg) rotate(25deg)}77%{left:8em;opacity:0;transform:skewX(25deg) rotate(-25deg)}80%{left:8em;opacity:1;transform:skewX(25deg) rotate(-25deg)}100%{left:5em;opacity:1;transform:skewX(0) rotate(0)}}
.boot .earth .boot-txt{display:flex;justify-content:center;align-items:center;padding-top:.6em;min-height:0;font-size:15px;font-weight:700;color:#fff}
.boot-meter{width:100%;max-width:260px;text-align:center}
.boot .pbar{padding:0;background:rgba(255,255,255,.12);border:2px solid #fff;border-radius:999px}
.boot .ptrack{height:10px}
.boot .boot-pct{margin-top:8px;font-size:18px;font-weight:800}
.boot .boot-tip{max-width:300px;margin-top:4px;text-align:center;font-size:12px;font-weight:700;color:rgba(255,255,255,.7)}
.ph{visibility:hidden}   /* giữ chỗ (không hiện) để chiều cao cột bằng game */

/* Lỗi: bước 1 = Trái Đất xám dần; bước 2 = thu nhỏ và trượt sang trái, thông tin lỗi hiện bên phải */
.stage{display:flex;flex-direction:column;align-items:center;width:100%}
.earth-loader{transition:filter 1.6s ease}
.boot.err .earth-loader{filter:grayscale(1) brightness(.6);animation:none}
.boot.halt .earth-loader svg{animation-play-state:paused}
.boot.noflash .earth-loader{animation:none}
.boot.err .earth .boot-txt{color:rgba(255,255,255,.75);transition:color 1.6s}
.stage.row{flex-direction:row;align-items:center;justify-content:center;gap:16px;max-width:340px}
.stage.row .earth-loader{font-size:11px;flex:none}
.errinfo{display:none;flex:1;min-width:0;text-align:left;opacity:0}
.stage.row .errinfo{display:block;animation:fadein .6s .35s ease forwards}
@keyframes fadein{to{opacity:1}}
.errinfo h1{font-size:17px;line-height:1.25;font-weight:800;color:var(--danger)}
.errinfo .maint{margin-top:6px;font-size:13.5px;line-height:1.4;color:#dfe6ff}
.errinfo .code{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.25);font:700 12.5px ui-monospace,Menlo,Consolas,monospace;color:var(--gold);letter-spacing:.03em}
#hint{width:100%;max-width:300px;font-size:14px;color:#dfe6ff;text-align:left}
#hint ul{margin:0 0 0 18px}
#hint li+li{margin-top:3px}
#detail{width:100%;max-width:300px;font:11.5px/1.35 ui-monospace,Menlo,Consolas,monospace;color:rgba(255,255,255,.55);word-break:break-all}
.actions{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px}
.btn{display:flex;align-items:center;justify-content:center;min-height:44px;padding:8px 14px;border:2px solid #fff;border-radius:999px;
  background:#2f6fe0;color:#fff;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.alt{background:transparent}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){.earth-loader svg{animation:none!important}.earth-loader{transition:none}.errinfo{animation:none!important;opacity:1}}
</style>
</head>
<body>

<div id="ldr" class="boot" role="status" aria-live="polite">
  <div class="stage" id="stage">
  <div class="earth">
    <div class="earth-loader" id="plant" data-s="1" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><path transform="translate(100 100)" d="M29.4,-17.4C33.1,1.8,27.6,16.1,11.5,31.6C-4.7,47,-31.5,63.6,-43,56C-54.5,48.4,-50.7,16.6,-41,-10.9C-31.3,-38.4,-15.6,-61.5,-1.4,-61C12.8,-60.5,25.7,-36.5,29.4,-17.4Z" fill="#7CC133"></path></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><path transform="translate(100 100)" d="M31.7,-55.8C40.3,-50,45.9,-39.9,49.7,-29.8C53.5,-19.8,55.5,-9.9,53.1,-1.4C50.6,7.1,43.6,14.1,41.8,27.6C40.1,41.1,43.4,61.1,37.3,67C31.2,72.9,15.6,64.8,1.5,62.2C-12.5,59.5,-25,62.3,-31.8,56.7C-38.5,51.1,-39.4,37.2,-49.3,26.3C-59.1,15.5,-78,7.7,-77.6,0.2C-77.2,-7.2,-57.4,-14.5,-49.3,-28.4C-41.2,-42.4,-44.7,-63,-38.5,-70.1C-32.2,-77.2,-16.1,-70.8,-2.3,-66.9C11.6,-63,23.1,-61.5,31.7,-55.8Z" fill="#7CC133"></path></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><path transform="translate(100 100)" d="M30.6,-49.2C42.5,-46.1,57.1,-43.7,67.6,-35.7C78.1,-27.6,84.6,-13.8,80.3,-2.4C76.1,8.9,61.2,17.8,52.5,29.1C43.8,40.3,41.4,53.9,33.7,64C26,74.1,13,80.6,2.2,76.9C-8.6,73.1,-17.3,59,-30.6,52.1C-43.9,45.3,-61.9,45.7,-74.1,38.2C-86.4,30.7,-92.9,15.4,-88.6,2.5C-84.4,-10.5,-69.4,-20.9,-60.7,-34.6C-52.1,-48.3,-49.8,-65.3,-40.7,-70C-31.6,-74.8,-15.8,-67.4,-3.2,-61.8C9.3,-56.1,18.6,-52.3,30.6,-49.2Z" fill="#7CC133"></path></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><path transform="translate(100 100)" d="M39.4,-66C48.6,-62.9,51.9,-47.4,52.9,-34.3C53.8,-21.3,52.4,-10.6,54.4,1.1C56.3,12.9,61.7,25.8,57.5,33.2C53.2,40.5,39.3,42.3,28.2,46C17,49.6,8.5,55.1,1.3,52.8C-5.9,50.5,-11.7,40.5,-23.6,37.2C-35.4,34,-53.3,37.5,-62,32.4C-70.7,27.4,-70.4,13.7,-72.4,-1.1C-74.3,-15.9,-78.6,-31.9,-73.3,-43C-68.1,-54.2,-53.3,-60.5,-39.5,-60.9C-25.7,-61.4,-12.9,-56,1.1,-58C15.1,-59.9,30.2,-69.2,39.4,-66Z" fill="#7CC133"></path></svg></div>
    <p id="msg" class="boot-txt">Đang kết nối máy chủ</p>
  </div>
  <div class="errinfo" id="errinfo">
    <h1 id="etitle"></h1>
    <p class="maint hidden" id="maint">Trang web đang bảo trì hoặc có thể đang gặp lỗi kết nối từ máy chủ.</p>
    <span class="code" id="ecode"></span>
  </div>
  </div>
  <div class="boot-meter ph" id="meter" aria-hidden="true"><div class="pbar"><div class="ptrack"></div></div><div class="boot-pct">0%</div></div>
  <div class="boot-tip ph" id="tip" aria-hidden="true">Mẹo: hoa chín nhanh hơn khi bạn dùng phân bón.</div>

  <div id="hint" class="hidden"></div>
  <div class="actions hidden" id="actions">
    <button class="btn" id="retry" type="button">Thử lại</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================= CẤU HÌNH (chỉnh tại đây) ================= */
// Nơi Web Admin lưu link. Dùng REST của Firebase Realtime DB: nhẹ, không cần SDK.
const CONFIG_URL = 'https://flower-game-b3153-default-rtdb.asia-southeast1.firebasedatabase.app/public_config/loader.json';

// Chỉ cho phép tải trang từ các tên miền này. Để [] = cho phép mọi https (kém an toàn).
// Ví dụ: ['kaiis.github.io', 'game.example.com', 'raw.githubusercontent.com']
const ALLOWED_HOSTS = [];

const T_CONFIG = 8000;    // timeout lấy link từ admin (ms)
const T_PAGE   = 20000;   // timeout tải HTML thật (ms)
const T_FRAME  = 12000;   // timeout khi dùng iframe dự phòng (ms)
const RETRIES  = 1;       // số lần thử lại khi timeout/mất mạng
const CACHE_KEY = 'ldr_cfg_v1'; // lưu link gần nhất để dùng khi DB không truy cập được
/* ============================================================== */

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

class LErr extends Error {
  constructor(kind, detail) { super(kind); this.kind = kind; this.detail = detail || ''; }
}

/* ---------- Giao diện ---------- */
// Màn tải chỉ có Trái Đất và một dòng chữ cố định; không hiện tiến độ.
const setProgress = () => {}, stage = () => {}, startCreep = () => {};
let creep, slowTimer;

const MESSAGES = {
  noconfig: ['Chưa có link trang',
    ['Quản trị viên chưa cài link trong Web Admin.', 'Liên hệ quản trị viên rồi thử lại.']],
  rules: ['Không đọc được cấu hình',
    ['Rules của Firebase đang chặn đọc public_config.', 'Quản trị viên cần mở quyền đọc cho nhánh này.']],
  config: ['Máy chủ cấu hình đang lỗi',
    ['Không lấy được link từ Web Admin.', 'Thử lại sau ít phút.']],
  badurl: ['Link không hợp lệ',
    ['Link phải bắt đầu bằng https:// và thuộc tên miền được phép.', 'Quản trị viên cần sửa lại link.']],
  timeout: ['Tải quá lâu',
    ['Máy chủ chứa trang không phản hồi kịp.', 'Kiểm tra mạng của bạn rồi thử lại.']],
  network: ['Không kết nối được',
    ['Mạng bị ngắt, hoặc máy chủ chứa trang chưa bật CORS.', 'Nếu mạng ổn, quản trị viên cần bật CORS cho link trang.']],
  http: ['Oops :(',
    ['Máy chủ trả về lỗi khi tải trang.', 'Quản trị viên cần kiểm tra lại link.']],
  notHtml: ['Link không phải trang web',
    ['Nội dung tải về không phải HTML.', 'Link phải trỏ thẳng tới file index.html.']],
  integrity: ['Trang bị thay đổi',
    ['Nội dung tải về không khớp mã SHA-256 mà admin đã đặt.', 'Đã chặn để bảo vệ bạn.']],
  frame: ['Không mở được trang',
    ['Trang không cho phép nhúng, hoặc máy chủ không phản hồi.', 'Thử mở link trực tiếp.']],
};

// Mã lỗi hiển thị cho người dùng (1xx = cấu hình, 2xx = kết nối, 3xx = khác)
const CODES = { noconfig:'E101', rules:'E102', config:'E103', badurl:'E104',
  timeout:'E201', network:'E202', http:'E203', notHtml:'E204', integrity:'E205', frame:'E301' };
// Các lỗi coi như "không kết nối được tới link động" -> hiện dòng bảo trì
const CONNECT_ERR = new Set(['rules', 'config', 'timeout', 'network', 'http', 'frame', 'noconfig']);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function showError(e, directUrl) {
  clearInterval(creep); clearTimeout(slowTimer);
  const kind = MESSAGES[e.kind] ? e.kind : 'network';
  const [title, tips] = MESSAGES[kind];
  const ldr = $('ldr'), earth = $('plant');
  document.title = title;
  console.error('[loader]', e.kind, e.detail || '');

  // Bước 1: Trái Đất xám dần (transition 1.6s trong CSS)
  ldr.classList.add('err');

  // Bước 2: dừng quay, thu nhỏ và trượt sang trái; thông tin lỗi hiện bên phải
  setTimeout(() => {
    ldr.classList.add('halt');
    const first = earth.getBoundingClientRect();

    $('msg').classList.add('hidden');
    $('meter').classList.add('hidden'); $('tip').classList.add('hidden');
    $('etitle').textContent = title;
    $('ecode').textContent = 'Mã lỗi: ' + (CODES[kind] || 'E000');
    const isConn = CONNECT_ERR.has(kind);
    $('maint').classList.toggle('hidden', !isConn);
    if (!isConn) {
      $('hint').innerHTML = '<ul>' + tips.map(t => '<li>' + t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</li>').join('') + '</ul>';
      $('hint').classList.remove('hidden');
    }
    $('actions').classList.remove('hidden');
    $('stage').classList.add('row');

    // FLIP: vẽ lại từ vị trí/kích thước cũ rồi trượt về vị trí mới
    const last = earth.getBoundingClientRect();
    if (!reduceMotion && last.width) {
      const dx = first.left - last.left, dy = first.top - last.top, s = first.width / last.width;
      earth.style.transformOrigin = 'top left';
      earth.animate(
        [{ transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')' }, { transform: 'none' }],
        { duration: 800, easing: 'cubic-bezier(.22,1,.36,1)' });
    }
  }, reduceMotion ? 0 : 1700);
}
// Thử lại: Trái Đất trượt về giữa, lấy lại màu và quay tiếp, sau đó tải lại (không reload trang)
let retrying = false;
$('retry').onclick = () => {
  if (retrying) return;
  retrying = true;
  const ldr = $('ldr'), earth = $('plant');
  const first = earth.getBoundingClientRect();

  ldr.classList.add('noflash');               // không chớp sáng lúc khởi động lại
  ldr.classList.remove('halt', 'err');        // quay lại + hết xám (transition trong CSS)
  $('msg').classList.remove('hidden');
  $('msg').textContent = 'Đang kết nối máy chủ';
  $('meter').classList.remove('hidden'); $('tip').classList.remove('hidden');
  $('hint').classList.add('hidden');
  $('actions').classList.add('hidden');
  $('stage').classList.remove('row');
  document.title = 'Đang kết nối máy chủ';

  const last = earth.getBoundingClientRect();
  let wait = 0;
  if (!reduceMotion && last.width) {
    const dx = first.left - last.left, dy = first.top - last.top, s = first.width / last.width;
    earth.style.transformOrigin = 'top left';
    earth.animate(
      [{ transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')' }, { transform: 'none' }],
      { duration: 800, easing: 'cubic-bezier(.22,1,.36,1)' });
    wait = 850;
  }
  setTimeout(() => { retrying = false; main(); }, wait);
};

/* ---------- Mạng ---------- */
async function fetchT(url, ms, opts) {
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), ms);
  try {
    return await fetch(url, { ...opts, signal: ac.signal });
  } catch (err) {
    if (err.name === 'AbortError') throw new LErr('timeout', 'Quá ' + ms / 1000 + ' giây: ' + url);
    // Trình duyệt không phân biệt được CORS với mất mạng, cả hai đều là TypeError
    throw new LErr('network', url + ' (' + (err.message || 'fetch failed') + ')');
  } finally { clearTimeout(timer); }
}
async function withRetry(fn) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) {
      if (i >= RETRIES || (e.kind !== 'timeout' && e.kind !== 'network')) throw e;
      await sleep(1200);
    }
  }
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

/* ---------- Bước 1: lấy link từ Web Admin ---------- */
async function getConfig() {
  try {
    const r = await fetchT(CONFIG_URL, T_CONFIG, { cache: 'no-store' });
    if (r.status === 401 || r.status === 403) throw new LErr('rules', 'HTTP ' + r.status);
    if (!r.ok) throw new LErr('config', 'HTTP ' + r.status);
    const c = await r.json();
    if (!c || typeof c.url !== 'string' || !c.url) throw new LErr('noconfig');
    store.set(CACHE_KEY, JSON.stringify(c));
    return c;
  } catch (e) {
    // Firebase không truy cập được: dùng link đã lưu lần trước (nếu có)
    if (e.kind === 'timeout' || e.kind === 'network' || e.kind === 'config') {
      const raw = store.get(CACHE_KEY);
      if (raw) { try { console.info('[loader] dùng link đã lưu gần nhất'); return JSON.parse(raw); } catch {} }
    }
    throw e;
  }
}

/* ---------- Bước 2: tải HTML thật ---------- */
function validate(raw) {
  let u;
  try { u = new URL(String(raw).trim()); } catch { throw new LErr('badurl', String(raw)); }
  if (u.protocol !== 'https:') throw new LErr('badurl', 'Chỉ chấp nhận https: ' + u.href);
  if (ALLOWED_HOSTS.length && !ALLOWED_HOSTS.includes(u.hostname)) throw new LErr('badurl', 'Tên miền chưa được phép: ' + u.hostname);
  return u;
}
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function loadHtml(url, cfg) {
  // no-cache: luôn hỏi lại máy chủ xem file có đổi không (không sửa URL nên không hỏng link có chữ ký)
  const r = await fetchT(url.href, T_PAGE, { cache: 'no-cache', credentials: 'omit', redirect: 'follow' });
  if (!r.ok) throw new LErr('http', 'HTTP ' + r.status + ' ' + url.href);
  const html = await r.text();
  if (html.length < 200 || !/<(!doctype|html|body|head)\b/i.test(html)) throw new LErr('notHtml', url.href);
  if (cfg.sha256) {
    const h = await sha256(html);
    if (h !== String(cfg.sha256).toLowerCase()) throw new LErr('integrity', 'got ' + h.slice(0, 16) + '…');
  }
  return html;
}

/* ---------- Bước 3: thay trang hiện tại bằng HTML thật ---------- */
function inject(html, baseHref) {
  const base = '<base href="' + baseHref.replace(/"/g, '&quot;') + '">';
  html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + base) : base + html;
  document.open(); document.write(html); document.close();
}

/* Dự phòng: iframe không cần CORS (nhưng bị chặn nếu trang gửi X-Frame-Options) */
function frameMode(href) {
  return new Promise((resolve, reject) => {
    const f = document.createElement('iframe');
    f.title = 'App'; f.src = href; f.referrerPolicy = 'no-referrer';
    f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;visibility:hidden';
    const t = setTimeout(() => { f.remove(); reject(new LErr('frame', 'Quá ' + T_FRAME / 1000 + ' giây: ' + href)); }, T_FRAME);
    f.onload = () => { clearTimeout(t); f.style.visibility = 'visible'; $('ldr').remove(); resolve(); };
    document.body.appendChild(f);
  });
}

/* ---------- Luồng chính ---------- */
async function main() {
  let firstUrl = '';
  try {
    startCreep();
    stage(1, 'Đang kết nối máy chủ'); setProgress(10, 30);
    const cfg = await getConfig();

    const list = [cfg.url, ...(Array.isArray(cfg.fallbacks) ? cfg.fallbacks : [])].filter(Boolean);
    try { firstUrl = validate(list[0]).href; } catch {}
    setProgress(32, 40);

    let last;
    for (const raw of list) {
      try {
        const url = validate(raw);
        if (cfg.mode === 'iframe') { stage(2, 'Đang mở trang'); await frameMode(url.href); return; }
        stage(2, 'Đang tải trang'); setProgress(40, 85);
        const html = await withRetry(() => loadHtml(url, cfg));
        stage(3, 'Đang khởi động'); setProgress(96, 100);
        clearInterval(creep); clearTimeout(slowTimer);
        inject(html, url.href);
        return;
      } catch (e) { last = e; console.warn('[loader] link lỗi, thử link kế tiếp:', e.kind, e.detail); }
    }

    // Mọi link đều không fetch được vì CORS/mạng → thử nhúng iframe link đầu tiên
    if (last && last.kind === 'network' && firstUrl) {
      stage(2, 'Đang mở trang theo cách khác');
      try { await frameMode(firstUrl); return; } catch (e) { last = e; }
    }
    throw last || new LErr('noconfig');
  } catch (e) {
    showError(e instanceof LErr ? e : new LErr('network', e && e.message), firstUrl);
  }
}
main();
})();
</script>
